<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartlegging av produksjonsroller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tilpasset styling for glidere */
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    input[type=range]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4">
  <main class="max-w-3xl mx-auto space-y-6">

    <!-- Header Bento Card -->
    <header class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl">
      <div class="inline-block px-3 py-1 bg-blue-500/20 text-blue-400 font-medium text-xs rounded-full mb-3">Undersøkelse</div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Kartlegging av produksjonsroller</h1>
      <p class="text-slate-400 mt-2 text-sm sm:text-base leading-relaxed">
        Hvor plasserer ulike roller seg i spennet mellom teknologi og innhold, og hvor stor operativ autonomi har de? Velg områdene du har erfaring med, og plasser rollene på aksene.
      </p>
    </header>

    <form id="surveyForm" class="space-y-6">

      <!-- Steg 1: Om respondenten -->
      <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 shadow-xl">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-xs flex items-center justify-center font-bold">1</span>
          Om deg
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Arbeidssted (By)</label>
            <select name="by" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500">
              <option value="" disabled selected>Velg by...</option>
              <option value="Oslo">Oslo</option>
              <option value="Bergen">Bergen</option>
              <option value="Trondheim">Trondheim</option>
              <option value="Tromsø">Tromsø</option>
              <option value="Annet">Annet</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ditt primære fagfelt</label>
            <select name="fagfelt" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500">
              <option value="" disabled selected>Velg fagområde...</option>
              <option value="Bilde & Foto">Bilde & Foto</option>
              <option value="Lyd">Lyd</option>
              <option value="Lys, Scene & Design">Lys, Scene & Design</option>
              <option value="Etterarbeid">Etterarbeid / Klipp</option>
              <option value="Teknisk Ledelse & Avvikling">Teknisk ledelse & Avvikling</option>
              <option value="Planlegging & Logistikk">Planlegging & Logistikk</option>
